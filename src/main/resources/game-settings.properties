game.version=Roguera build v0.4.0_alpha:1111:1353
game.random.seed=
dungeon.world.size.xbound=200
dungeon.world.size.ybound=100
dungeon.world.rooms.count=5
# Размер окна.
# Если window.pixel.width / window.pixel.height заданы, колонки/строки сетки
# рассчитываются автоматически из метрик шрифта (cell = fontWidth × fontHeight).
# Если оставить пустыми — используются window.size.width / window.size.height
# в колонках/строках напрямую (старое поведение Lanterna).
window.pixel.width=1600
window.pixel.height=900
window.size.width=210
window.size.height=40
font.size=18
font.filepath=/PixelCode.ttf

# debug settings
debug.show.system-info=true
debug.show.draw-room=false
debug.show.dungeon-generate=false
debug.show.key-input=false
debug.show.player-movement=false
debug.show.event-raise=false
debug.show.room-create=false
debug.dump.events=true
debug.dump.objects=true